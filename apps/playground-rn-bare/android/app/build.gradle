plugins {
  id "com.android.application"
}

android {
  namespace "dev.vifx.playground"
  compileSdk 35

  defaultConfig {
    applicationId "dev.vifx.playground"
    minSdk 23
    targetSdk 35
    versionCode 1
    versionName "1.0"
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.debug
    }
  }
}
