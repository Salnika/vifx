packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^26
  cac: ^7.1.0
  typescript: ^7
  # 0.25.0 is younger than pnpm's 24h minimumReleaseAge; bump once it clears.
  tsrs: 0.24.0-ts7.1.0-beta
  # Published packages depend on the Vite+ core by its own name: a `vite` alias
  # would take the `vite` slot of an app installed with npm, Yarn classic, Bun
  # or pnpm's hoisted linker. The `vite` alias below is for this workspace's own
  # tooling only. Keep both on the `vite-plus` version.
  "@voidzero-dev/vite-plus-core": 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  oxc-minify: ^0.158.0
  ws: ^8.22.2
  "@react-native/dev-middleware": ^0.88.1
  "@types/ws": ^8.18.2
  react-refresh: ^0.14.2
  "@changesets/cli": ^3.0.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
