name: docs

# Builds the documentation site (apps/docs) and deploys it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches:
      - master
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      # The nav shows the released version: redeploy when a release bumps it.
      - "packages/cli/package.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.repository == 'Salnika/vifx'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Build the site
        run: pnpm docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
